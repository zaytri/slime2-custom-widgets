<div id="widget"></div>

<!-- message template, inserted into the widget above -->
<template id="message-template">
	<div class="message">
		<div class="user-box">
			<div class="user">
				<span class="badges"></span>
			</div>
		</div>
		<div class="content-border">
			<div class="content-box">
				<div class="content"></div>
			</div>
		</div>
	</div>
</template>

<!-- user label template, inserted into the user class -->
<template id="user-template">
	<span class="user-label">
		<span class="display-name"></span>
		<span class="username"></span>
		<span class="pronouns"></span>
	</span>
</template>

<!-- badge template, inserted into the badges class -->
<template id="badge-template">
	<img class="badge" />
</template>

<!-- text template, inserted into the content class -->
<template id="text-fragment-template">
	<span class="text"></span>
</template>

<!-- mention template, inserted into the content class -->
<template id="mention-fragment-template">
	<span class="mention"></span>
</template>

<!-- emote template, inserted into the content class -->
<template id="emote-fragment-template">
	<img class="emote animated" />
	<img class="emote static" />
</template>

<!-- cheermote template, inserted into the content class -->
<template id="cheermote-fragment-template">
	<img class="cheermote emote animated" />
	<img class="cheermote emote static" />
	<span class="cheer-amount"></span>
</template>
